<!-- KPI DASHBOARD & OPERATIONAL HEALTH MATRIX (16:9) -->
<div class="slide-page layout-kpi-dashboard">
    <div class="slide-header">
        <div class="slide-meta">
            <span>Ahamove Operational Health • SLA Matrix</span>
            <span>Slide {{slide_id}}</span>
        </div>
        <div class="takeaway-title editable">{{takeaway_header}}</div>
    </div>

    <div class="content-grid" style="grid-template-columns: repeat(3, 1fr);">
        {{#cards}}
        <div class="glass-card">
            <div class="card-header">
                <span>{{icon_badge}}</span>
                <span class="editable">{{title}}</span>
            </div>
            <ul class="bullet-list">
                {{#bullets}}<li class="bullet-item editable">{{.}}</li>{{/bullets}}
            </ul>
        </div>
        {{/cards}}
    </div>

    <div class="slide-footer">
        <span>Confidential • Ops Health Matrix Layout</span>
        <span>Source: Slide {{source_slides}}</span>
    </div>
</div>
