<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>{deck_title}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {{
            --bg: #050812;
            --panel: rgba(15, 23, 42, 0.72);
            --panel-2: rgba(20, 31, 55, 0.58);
            --border: rgba(148, 163, 184, 0.18);
            --text: #F8FAFC;
            --muted: #94A3B8;
            --blue: #38BDF8;
            --cyan: #22D3EE;
            --orange: #FF7F32;
            --green: #34D399;
            --red: #FB7185;
            --purple: #A78BFA;
            --font-family: Inter, Lexend, sans-serif;
        }}
        * {{ box-sizing: border-box; margin: 0; padding: 0; }}
        html {{ background: #02040a; }}
        body {{
            background:
                radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.12), transparent 28%),
                radial-gradient(circle at 88% 12%, rgba(255, 127, 50, 0.10), transparent 26%),
                radial-gradient(circle at 70% 85%, rgba(167, 139, 250, 0.08), transparent 30%),
                #02040a;
            font-family: var(--font-family); color: var(--text);
            display: flex; flex-direction: column; align-items: center; padding: 34px 0; gap: 34px;
        }}
        body:before {{
            content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.22;
            background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 48px 48px;
        }}
        .toolbar {{
            position: fixed; bottom: 22px; right: 22px; z-index: 9999;
            background: rgba(7, 12, 24, 0.82); backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.14); padding: 10px 16px; border-radius: 999px;
            display: flex; gap: 10px; align-items: center; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        }}
        .toolbar button {{ background: linear-gradient(135deg, var(--orange), #ff9a5b); color: #fff; border: 0; padding: 9px 15px; border-radius: 999px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s; }}
        .toolbar button:hover {{ transform: translateY(-2px); filter: brightness(1.08); }}
        .slide-page {{
            width: 1920px; height: 1080px;
            background:
                radial-gradient(circle at 92% 0%, rgba(34, 211, 238, 0.09), transparent 25%),
                radial-gradient(circle at 4% 100%, rgba(255, 127, 50, 0.08), transparent 24%),
                linear-gradient(135deg, #07101f 0%, #050914 52%, #07111f 100%);
            border: 1px solid rgba(148, 163, 184, 0.16); border-radius: 24px;
            padding: 44px 54px; display: flex; flex-direction: column; justify-content: space-between;
            position: relative; box-shadow: 0 30px 100px rgba(0, 0, 0, 0.58); overflow: hidden;
        }}
        .slide-page:after {{
            content: ""; position: absolute; width: 520px; height: 520px; right: -240px; top: -280px;
            border: 1px solid rgba(56, 189, 248, 0.12); border-radius: 50%;
            box-shadow: 0 0 0 80px rgba(56, 189, 248, 0.018), 0 0 0 160px rgba(56, 189, 248, 0.012);
            pointer-events: none;
        }}
        .slide-header {{ display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; }}
        .slide-meta {{
            display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800;
            color: var(--cyan); text-transform: uppercase; letter-spacing: 1.5px;
        }}
        .slide-meta span:last-child {{
            color: #CBD5E1; background: rgba(255, 255, 255, 0.055); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 999px;
        }}
        .takeaway-title {{
            font-size: 28px; font-weight: 800; color: #F8FAFC; line-height: 1.22; letter-spacing: -0.6px;
            max-width: 1760px; text-shadow: 0 2px 22px rgba(56, 189, 248, 0.08);
        }}
        
        /* Key Takeaway Banner */
        .takeaway-banner {{
            background: linear-gradient(135deg, rgba(255, 127, 50, 0.15), rgba(56, 189, 248, 0.10));
            border: 1px solid rgba(255, 127, 50, 0.3); border-radius: 12px;
            padding: 10px 16px; display: flex; align-items: center; gap: 10px;
            font-size: 14px; font-weight: 700; color: #FFE0D1; margin-top: 4px;
        }}

        .hero-kpi-grid {{
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 10px;
        }}
        .hero-kpi-card, .glass-card {{
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.68), rgba(8, 15, 29, 0.58));
            border: 1px solid var(--border); border-radius: 16px; backdrop-filter: blur(18px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 18px 45px rgba(0, 0, 0, 0.22);
            position: relative; overflow: hidden;
        }}
        .hero-kpi-card {{ padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; min-height: 110px; }}
        .hero-kpi-card:before {{
            content: ""; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, var(--orange), var(--blue)); box-shadow: 0 0 18px rgba(255, 127, 50, 0.55);
        }}
        .hero-kpi-label {{ font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }}
        .hero-kpi-val {{
            font-size: 44px; font-weight: 900; color: #fff; line-height: 0.98; letter-spacing: -1.5px;
        }}
        .hero-kpi-badge {{
            display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 800; width: max-content; border: 1px solid rgba(255, 255, 255, 0.08);
        }}
        .badge-positive {{ background: rgba(52, 211, 153, 0.11); color: #6EE7B7; }}
        .badge-negative {{ background: rgba(251, 113, 133, 0.11); color: #FDA4AF; }}
        .badge-neutral {{ background: rgba(56, 189, 248, 0.10); color: #7DD3FC; }}
        .badge-warning {{ background: rgba(245, 158, 11, 0.11); color: #FCD34D; }}

        .content-grid {{
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; flex: 1; margin-top: 14px; min-height: 0;
        }}
        .glass-card {{
            padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; min-height: 0;
        }}
        .card-header {{
            display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; color: #E2E8F0;
        }}
        .card-header span:first-child {{
            width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(255, 127, 50, 0.12));
            border: 1px solid rgba(56, 189, 248, 0.16); font-size: 15px;
        }}
        .bullet-list {{ list-style: none; display: flex; flex-direction: column; gap: 8px; }}
        .bullet-item {{
            font-size: 13.5px; line-height: 1.45; color: #CBD5E1; position: relative; padding-left: 18px;
        }}
        .bullet-item:before {{
            content: ""; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%;
            background: var(--orange); box-shadow: 0 0 8px rgba(255, 127, 50, 0.7);
        }}

        /* Executive Comment Callout Card */
        .executive-comment-card {{
            background: linear-gradient(135deg, rgba(14, 65, 116, 0.35), rgba(15, 23, 42, 0.65));
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 14px;
            padding: 12px 18px; display: flex; flex-direction: column; gap: 4px;
            margin-top: 12px;
        }}
        .comment-header {{ font-size: 12px; font-weight: 800; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }}
        .comment-body {{ font-size: 13px; font-weight: 600; color: #F1F5F9; line-height: 1.4; }}

        .data-table {{
            width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 4px; font-size: 12.5px; overflow: hidden;
            border: 1px solid var(--border); border-radius: 12px;
        }}
        .data-table th {{
            background: rgba(56, 189, 248, 0.08); color: #7DD3FC; font-weight: 800; text-align: left;
            padding: 8px 12px; border-bottom: 1px solid var(--border);
        }}
        .data-table td {{
            padding: 8px 12px; color: #CBD5E1; border-bottom: 1px solid rgba(148, 163, 184, 0.10);
            background: rgba(255, 255, 255, 0.015);
        }}
        .data-table tr:last-child td {{ border-bottom: 0; }}
        .data-table tbody tr:hover td {{ background: rgba(56, 189, 248, 0.045); }}
        .slide-footer {{
            display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748B;
            border-top: 1px solid rgba(148, 163, 184, 0.13); padding-top: 10px; margin-top: 10px;
        }}
        [contenteditable="true"]:focus {{ outline: 2px solid var(--orange); background: rgba(255, 127, 50, 0.08); border-radius: 6px; }}
        @media print {{
            body {{ background: #02040a; padding: 0; }} .toolbar {{ display: none; }}
            .slide-page {{ page-break-after: always; box-shadow: none; border-radius: 0; }}
        }}
    </style>
</head>
<body>

    <div class="toolbar">
        <span style="color:#7DD3FC; font-size:13px; font-weight:800; letter-spacing:.4px;">⚡ AHAMOVE • 16:9 EXECUTIVE REPORT</span>
        <button id="editBtn" onclick="toggleEditMode()">✏️ Edit Mode (E)</button>
        <button onclick="window.print()">🖨️ Export PDF</button>
    </div>

    {slides_html}

    <script>
        let isEdit = false;
        function toggleEditMode() {{
            isEdit = !isEdit;
            document.querySelectorAll('.editable').forEach(el => {{
                el.contentEditable = isEdit;
            }});
            const btn = document.getElementById('editBtn');
            btn.innerText = isEdit ? '💾 Save Mode (E)' : '✏️ Edit Mode (E)';
            btn.style.background = isEdit ? '#34D399' : '#FF7F32';
        }}

        document.addEventListener('keydown', (e) => {{
            if (e.key === 'e' || e.key === 'E') {{
                if (document.activeElement.isContentEditable) return;
                toggleEditMode();
            }}
        }});
    </script>
</body>
</html>
