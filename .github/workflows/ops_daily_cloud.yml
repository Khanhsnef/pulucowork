name: Ops Daily Metabase & SGN Report (Cloud 24/7)

on:
  schedule:
    # 06:00 AM ICT (23:00 UTC) - Trigger Metabase export to Google Sheets
    - cron: '0 23 * * *'
    # 07:00 AM ICT (00:00 UTC) - Generate & send SGN Daily Telegram Report
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - metabase
          - sgn_report

jobs:
  metabase-export:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'metabase') || github.event.schedule == '0 23 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Trigger Metabase Export
        env:
          TZ: Asia/Ho_Chi_Minh
        run: python3 _scripts/trigger_metabase_export.py

      - name: Sync Card 74433 Snapshot from Google Sheet (if public)
        run: |
          sleep 15
          python3 -c "
          import csv, io, json, urllib.request
          from pathlib import Path
          url = 'https://docs.google.com/spreadsheets/d/1BniOS6rJHulyyCLJb13jkc3UWuSRZBraLEmJI6xFNG0/export?format=csv&gid=2008886787'
          req = urllib.request.Request(url, headers={'User-Agent': 'GitHub-Actions/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              txt = r.read().decode('utf-8', errors='replace')
          if txt.lstrip().startswith('<'):
              print('Sheet is private; skipping snapshot sync.')
          else:
              rows = [row for row in csv.DictReader(io.StringIO(txt)) if row.get('order_date')]
              if rows:
                  Path('Output/Ahamove/04. OPS_METRICS/card_74433_63d.json').write_text(json.dumps(rows, ensure_ascii=False), encoding='utf-8')
                  print(f'Updated card_74433_63d.json ({len(rows)} rows)')
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Output/Ahamove/04. OPS_METRICS/card_74433_63d.json"
          if ! git diff --staged --quiet; then
            git commit -m "chore(ops): sync Card 74433 63-day snapshot"
            git push
          fi

  sgn-daily-report:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'sgn_report') || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Chromium
        run: |
          pip install requests pandas streamlit playwright
          python3 -m playwright install chromium

      - name: Run SGN Daily Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Ho_Chi_Minh
        run: python3 _scripts/sgn_daily_telegram_report.py

      - name: Update & Push Ops Pulse Snapshot for @DMAIChat_Bot
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'projects/dmai-chat-bot')
          import ops_metrics
          from pathlib import Path
          brief = ops_metrics.build_ops_brief_from_sheet()
          Path('Output/Ahamove/04. OPS_METRICS/latest_ops_pulse.md').write_text(brief + '\n', encoding='utf-8')
          print('Saved latest_ops_pulse.md')
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output/Ahamove/04.\ OPS_METRICS/latest_ops_pulse.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(ops): update daily SGN Ops Pulse snapshot"
            git push
          fi
