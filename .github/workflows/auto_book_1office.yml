name: 1Office Auto Booking 24/7

on:
  schedule:
    # 08:45 UTC Thứ 6 hàng tuần = 15:45 ICT (Khởi động runner sớm 15 phút để chống trễ hàng đợi GitHub)
    - cron: '45 8 * * 5'
    # 08:55 UTC Thứ 6 hàng tuần = 15:55 ICT (Mốc dự phòng bổ sung)
    - cron: '55 8 * * 5'
  workflow_dispatch:
    inputs:
      skip_sleep:
        description: 'Bỏ qua đếm ngược (1 = Bỏ qua)'
        required: false
        default: '0'

concurrency:
  group: 1office-auto-booking
  cancel-in-progress: false

jobs:
  book-meeting-rooms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run 1Office Auto Booking Script
        env:
          ONE_OFFICE_USERNAME: ${{ secrets.ONE_OFFICE_USERNAME }}
          ONE_OFFICE_PASSWORD: ${{ secrets.ONE_OFFICE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_SLEEP: ${{ inputs.skip_sleep || '' }}
        run: |
          python3 scripts/1office-booking/book_rooms.py
