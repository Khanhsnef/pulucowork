name: 1Office Auto Booking 24/7

on:
  schedule:
    # 08:58 UTC Thứ 6 hàng tuần = 15:58 ICT (Khởi chạy trước 2 phút để runner kịp boot & đợi đúng 16:00:01 ICT)
    - cron: '58 8 * * 5'
  workflow_dispatch:
    inputs:
      skip_sleep:
        description: 'Bỏ qua đếm ngược (1 = Bỏ qua)'
        required: false
        default: '0'

jobs:
  book-meeting-rooms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run 1Office Auto Booking Script
        env:
          ONE_OFFICE_USERNAME: ${{ secrets.ONE_OFFICE_USERNAME }}
          ONE_OFFICE_PASSWORD: ${{ secrets.ONE_OFFICE_PASSWORD }}
          SKIP_SLEEP: ${{ inputs.skip_sleep || '' }}
        run: |
          python3 scripts/1office-booking/book_rooms.py
